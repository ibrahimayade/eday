spring.application.name=customer-service
server.port=8082
spring.datasource.url=jdbc:h2:mem:customer-db
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}
spring.h2.console.enabled=true
spring.cloud.discovery.enabled=true
## demander ou pas d'aller chercher la config ailleur
spring.cloud.config.enabled=true
spring.liquibase.enabled=false

## pour afficher ladresse ip dans l discovery
#eureka.instance.prefer-ip-address=true
## ou se trouve eureka
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka

## activer les enpoints de actuators afin d voir la sante
management.endpoints.web.exposure.include=*

## pour la security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/eday-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/eday-realm/protocol/openid-connect/certs
# keycloak config
keycloak.realm=eday-realm
keycloak.resource=eday-customer
keycloak.bearer-only=true
keycloak.auth-server-url=http://localhost:8080/auth/
keycloak.ssl-required=none
keycloak.public-client= false



