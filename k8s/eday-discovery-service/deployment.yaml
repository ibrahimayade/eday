apiVersion: apps/v1
kind: Deployment
metadata:
  name: eday-discovery-service
  namespace: eday
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eday-discovery-service
  template:
    metadata:
      labels:
        app: eday-discovery-service
    spec:
      containers:
        - name: discovery
          image: yadibrahim/eday-discovery-service:latest
          ports:
            - containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 10
            periodSeconds: 10


