spring.application.name=gateway-service
server.port=8888
spring.main.web-application-type=reactive
spring.main.allow-bean-definition-overriding=true
#spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.discovery.enabled=true
## demander ou pas d'aller chercher la config ailleur
spring.cloud.config.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
logging.level.org.springframework=DEBUG


## security with oauth2, keycloak and spring security
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/eday-realm
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/eday-realm/protocol/openid-connect/certs


### from remote config
spring.h2.console.enabled=true
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
management.endpoints.web.exposure.include=*