spring.application.name=account-service
server.port=8082
spring.datasource.url=jdbc:h2:mem:account-db
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}
spring.h2.console.enabled=true
# Création/modification automatique du schéma de la base
spring.jpa.hibernate.ddl-auto=update

# (Optionnel) Afficher les requêtes SQL dans la console
spring.jpa.show-sql=true

# (Optionnel) Formater le SQL affiché
spring.jpa.properties.hibernate.format_sql=true
spring.cloud.discovery.enabled=true
## demander ou pas d'aller chercher la config ailleur
spring.cloud.config.enabled=true
## pour afficher ladresse ip dans l discovery
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
## ou se trouve eureka
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
## activer les enpoints de actuators afin d voir la sante
management.endpoints.web.exposure.include=*


